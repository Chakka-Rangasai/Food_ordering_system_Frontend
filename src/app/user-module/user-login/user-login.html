<div class="login-background">
  <div class="card shadow-lg border-0 rounded-3">
    <div class="card-header text-white text-center py-3">
      <h3 class="mb-0">Login</h3>
    </div>
    <div class="card-body p-4">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-floating mb-3">
          <input type="email" id="email" class="form-control"
                 formControlName="email" placeholder="Email">
          <label for="email">Email</label>
          <div *ngIf="loginForm.controls['email'].touched && loginForm.controls['email'].errors?.['required']"
               class="msg-red small mt-1">
            Email is required.
          </div>
          <div *ngIf="loginForm.controls['email'].touched && loginForm.controls['email'].errors?.['email']"
               class="msg-orange small mt-1">
            Please enter a valid email address.
          </div>
        </div>
       <div class="form-floating mb-3 position-relative">
  <input 
    [type]="showPassword ? 'text' : 'password'" 
    id="password" 
    class="form-control pe-5"
    formControlName="password" 
    placeholder="Password">
  <label for="password">Password</label>
  <button type="button" class="btn-eye" (click)="togglePasswordVisibility()" tabindex="-1">
    <span *ngIf="!showPassword">👁️</span>
    <span *ngIf="showPassword">🙈</span>
  </button>
  <div *ngIf="loginForm.controls['password'].touched && loginForm.controls['password'].invalid">
    <div *ngIf="loginForm.controls['password'].errors?.['required']" class="msg-red small mt-1">
      Password is required.
    </div>
    <div *ngIf="loginForm.controls['password'].errors?.['minlength']" class="msg-orange small mt-1">
      Password must be at least 6 characters long.
    </div>
    <div *ngIf="loginForm.controls['password'].errors?.['pattern']" class="msg-orange small mt-1">
      Password must contain at least one letter and one number.
    </div>
  </div>
</div>
        <div class="text-end mb-3">
          <a routerLink="/forgot-password" class="forgot-password-link">Forgot Password?</a>
        </div>
        <button type="submit" class="btn-login w-100 py-2" [disabled]="loginForm.invalid">
          Login
        </button>
      </form>
      <div class="text-center mt-3">
        <small>Don’t have an account? 
          <a routerLink="/register" class="create-account-link">Create one</a>
        </small>
      </div>
    </div>
  </div>
</div>
